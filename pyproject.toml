[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "promptforge"
version = "1.0.0"
description = "Generator de prompturi detaliate (300-500 de cuvinte) pentru modele de text și de imagine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
refine = ["anthropic>=0.40"]

[project.scripts]
promptforge = "promptforge.cli:main"

[tool.setuptools]
packages = ["promptforge"]
