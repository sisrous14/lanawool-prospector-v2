[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "promptforge"
version = "1.4.5"
description = "Generator de prompturi detaliate (300-3000 de cuvinte) pentru text, imagine, video și SEO, cu analiză de poze și linkuri"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
# Necesare doar pentru funcțiile care folosesc un model: --refine, vision, remix.
model = ["anthropic>=0.40"]
refine = ["anthropic>=0.40"]          # nume păstrat din versiunea anterioară
images = ["anthropic>=0.40", "pillow>=10"]   # + redimensionarea pozelor mari
# Unelte de dezvoltare: testele de contract cu SDK-ul și cele de interfață.
dev = ["anthropic>=0.40", "pillow>=10", "playwright>=1.40", "pyflakes"]

[project.scripts]
promptforge = "promptforge.cli:main"

[tool.setuptools]
packages = ["promptforge"]
